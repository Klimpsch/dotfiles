# Nord theme for sway
# Palette: nord0 #2E3440  nord1 #3B4252  nord2 #434C5E  nord3 #4C566A
#          nord4 #D8DEE9  nord5 #E5E9F0  nord6 #ECEFF4
#          frost: nord7 #8FBCBB  nord8 #88C0D0  nord9 #81A1C1  nord10 #5E81AC
#          aurora: red #BF616A  orange #D08770  yellow #EBCB8B  green #A3BE8C  purple #B48EAD

# Window colours
# class                 border  bg      text    indicator child_border
client.focused          #88C0D0 #88C0D0 #2E3440 #8FBCBB   #88C0D0
client.focused_inactive #4C566A #3B4252 #D8DEE9 #4C566A   #4C566A
client.unfocused        #3B4252 #2E3440 #D8DEE9 #3B4252   #3B4252
client.urgent           #BF616A #BF616A #ECEFF4 #BF616A   #BF616A
client.placeholder      #2E3440 #2E3440 #D8DEE9 #2E3440   #2E3440
client.background       #2E3440

# Plain Nord background (comment this out to keep your wallpaper)
output * bg #2E3440 solid_color

# Nord-coloured launcher
font pango:JetBrains Mono 10
